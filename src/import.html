<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Import</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body {
                position: relative;
                min-height: 100vh;
            }
        </style>
    </head>

    <body>
        <!-- Top Bar will be generated programmatically -->

        <header>
            <h1>Import</h1>
            <p>Import your existing quizzes or data into Cognica.</p>
        </header>

        <main>
            <button class="btn" id="back" onclick="window.location.href = './index.html'">Cancel</button>
            
        </main>

        <script src="/node_modules/localforage/dist/localforage.js"></script>
        <script type="module">
            import {
                loadTheme,
                createImageUploader,
                fileToBase64,
                createSetTemplate,
                initState,
                getState,
                saveFullState,
                updateState,
                generateNavbar,
            } from "./lib.js";

            const nav = generateNavbar();
            document.body.prepend(nav);

            let state;

            async function initApp() {
                state = await getState();
                if (state) {
                    loadTheme(state.userPrefs.theme);
                }

                
            }

            await initApp();
        </script>
    </body>
</html>
