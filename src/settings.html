<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Settings</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body {
                position: relative;
                min-height: 100vh;
            }

            .settings-layout {
                display: grid;
                grid-template-columns: 240px 1fr;
                gap: 32px;
                max-width: 1000px;
                margin: 0 auto;
                align-items: start;
            }

            .settings-sidebar {
                display: flex;
                flex-direction: column;
                gap: 4px;
                position: sticky;
                top: 80px;
            }

            .category-btn {
                display: block;
                width: 100%;
                text-align: left;
                padding: 10px 14px;
                background: transparent;
                border: none;
                color: var(--text-muted);
                font-family: inherit;
                font-size: 0.9rem;
                cursor: pointer;
                border-radius: 6px;
                transition: all 0.2s ease;
            }

            .category-btn:hover {
                background-color: var(--surface-darker);
                color: var(--text);
            }

            .category-btn.active {
                background-color: var(--surface);
                color: var(--accent);
                font-weight: 600;
            }

            .settings-content {
                background: var(--card);
                border: 1px solid var(--border-main);
                border-radius: 12px;
                padding: 32px;
                min-height: 400px;
            }

            .setting-item {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 24px;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--border-main);
            }

            .setting-item:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }

            .setting-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
            }

            .setting-label {
                font-weight: 600;
                font-size: 0.95rem;
            }

            .setting-description {
                font-size: 0.8rem;
                color: var(--text-muted);
                margin-bottom: 12px;
            }

            .dangerous-section {
                margin-top: 32px;
                padding-top: 16px;
            }

            .dangerous-section h2 {
                color: var(--red);
                font-size: 1rem;
                margin-bottom: 20px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .dangerous-item {
                border: 1px solid var(--red-muted);
                padding: 16px;
                border-radius: 8px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
        </style>
    </head>

    <body>
        <!-- Top Bar -->
        <!-- Top Bar will be generated programmatically -->

        <header>
            <h1>Settings</h1>
            <p>Cognica is designed to be as customizable as possible.</p>
        </header>

        <main>
            <button class="btn" id="back">Back to Home</button>
            <div class="settings-layout">
                <aside class="settings-sidebar" id="settings-sidebar">
                    <!-- Categories will be rendered here -->
                </aside>
                <section class="settings-content" id="settings-content">
                    <!-- Settings will be rendered here -->
                </section>
            </div>
        </main>

        <script src="/node_modules/localforage/dist/localforage.js"></script>
        <script type="module">
            import {
                loadTheme,
                createImageUploader,
                fileToBase64,
                createSetTemplate,
                initState,
                getState,
                saveFullState,
                updateState,
                generateNavbar,
                capitalize
            } from "./lib.js";

            const nav = generateNavbar();
            document.body.prepend(nav);

            const SETTINGS_CONFIG = {
                general: {
                    label: "General",
                    settings: [
                        {
                            id: "userName",
                            label: "Display Name",
                            type: "text",
                            description: "The name shown on your profile.",
                        },
                        {
                            id: "theme",
                            label: "Appearance",
                            type: "toggle",
                            options: [
                                { value: "light", label: "Light" },
                                { value: "dark", label: "Dark" },
                                { value: "system-default", label: "System" },
                                { value: "time", label: "Time Based" },
                            ],
                            description: "Switch between light and dark modes.",
                        },
                    ],
                },
                experience: {
                    label: "Experience",
                    settings: [
                        {
                            id: "difficulty",
                            label: "Default Difficulty",
                            type: "select",
                            options: ["easy", "medium", "hard"],
                            description: "The default difficulty for new quizzes.",
                        },
                        {
                            id: "showHints",
                            label: "Show Hints",
                            type: "checkbox",
                            description: "Enable hints during the quiz.",
                        },
                    ],
                },
                addons: {
                    label: "Add-ons",
                    settings: [
                        {
                            id: "enableAddons",
                            label: "Enable Add-ons",
                            type: "checkbox",
                            description: "Allow the use of third-party add-ons.",
                        },
                    ],
                },
                danger: {
                    label: "Danger Zone",
                    isDangerous: true,
                    settings: [
                        {
                            id: "resetData",
                            label: "Reset All Data",
                            type: "button",
                            action: "reset",
                            dangerous: true,
                            description: "Permanently delete all your quiz data and preferences.",
                        },
                    ],
                },
            };

            let state;
            let currentCategory = "general";

            async function initApp() {
                state = await getState();
                if (state) {
                    loadTheme(state.userPrefs.theme);
                }

                renderSidebar();
                renderContent();

                // allow page to go back to previous screen based on url query params
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has("back")) {
                    const backUrl = urlParams.get("back");
                    const backSet = urlParams.get("set");
                    const backBtn = document.getElementById("back");

                    console.log(backUrl);
                    
                    backBtn.onclick = () => {
                        switch (backUrl) {
                            case "home":
                                window.location.href = "./index.html";
                                break;
                            case "editor":
                                if (backSet) {
                                    window.location.href = `./editor.html?set=${backSet}`;
                                } else {
                                    window.location.href = "./editor.html";
                                }
                                break;
                              case "quiz":
                                if (backSet) {
                                    window.location.href = `./quiz.html?set=${backSet}`;
                                } else {
                                    window.location.href = "./quiz.html";
                                }
                                break;
                            case "import":
                                window.location.href = "./import.html";
                                break;
                            default:
                                window.location.href = "./index.html";
                        } 
                    };

                    document.getElementById("back").textContent = `Back to ${capitalize(backUrl.includes("?") ? backUrl.split("?")[0] : backUrl)}`;
                } else {
                    document.getElementById("back").textContent = "Back to Home";
                    document.getElementById("back").onclick = () => {
                        window.location.href = "./index.html";
                    };
                }
            }

            function renderSidebar() {
                const sidebar = document.getElementById("settings-sidebar");
                sidebar.innerHTML = "";

                Object.entries(SETTINGS_CONFIG).forEach(([id, config]) => {
                    const btn = document.createElement("button");
                    btn.className = `category-btn ${id === currentCategory ? "active" : ""}`;
                    btn.textContent = config.label;
                    btn.onclick = () => {
                        currentCategory = id;
                        renderSidebar();
                        renderContent();
                    };
                    sidebar.appendChild(btn);
                });
            }

            function renderContent() {
                const content = document.getElementById("settings-content");
                content.innerHTML = "";

                const config = SETTINGS_CONFIG[currentCategory];
                if (!config) {
                    content.innerHTML = "<p>Category not found.</p>";
                    return;
                }

                // Loading state simulation
                const skeleton = document.createElement("div");
                skeleton.innerHTML = `
                    <div class="skeleton" style="width: 40%; height: 24px; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="width: 100%; height: 60px; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="width: 100%; height: 60px; margin-bottom: 24px;"></div>
                `;
                content.appendChild(skeleton);

                setTimeout(() => {
                    renderSettingsList();
                }, 300);
            }

            function renderSettingsList() {
                const content = document.getElementById("settings-content");
                const config = SETTINGS_CONFIG[currentCategory];

                if (!config) return;

                content.innerHTML = "";

                if (config.isDangerous) {
                    const section = document.createElement("div");
                    section.className = "dangerous-section";
                    section.innerHTML = `<h2>${config.label}</h2>`;

                    config.settings.forEach((setting) => {
                        section.appendChild(createSettingElement(setting));
                    });
                    content.appendChild(section);
                } else {
                    config.settings.forEach((setting) => {
                        content.appendChild(createSettingElement(setting));
                    });
                }
            }

            function createSettingElement(setting) {
                const container = document.createElement("div");
                container.className = setting.dangerous ? "dangerous-item" : "setting-item";

                const header = document.createElement("div");
                header.className = "setting-header";

                const label = document.createElement("span");
                label.className = "setting-label";
                label.textContent = setting.label;
                header.appendChild(label);

                let input;
                const value = state?.userPrefs?.[setting.id] ?? "";

                if (setting.type === "text") {
                    input = document.createElement("input");
                    input.type = "text";
                    input.value = value;
                    input.onchange = (e) => updateSetting(setting.id, e.target.value);
                } else if (setting.type === "select") {
                    input = document.createElement("select");
                    setting.options.forEach((opt) => {
                        const option = document.createElement("option");
                        option.value = opt;
                        option.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
                        if (opt === value) option.selected = true;
                        input.appendChild(option);
                    });
                    input.onchange = (e) => updateSetting(setting.id, e.target.value);
                } else if (setting.type === "checkbox") {
                    input = document.createElement("input");
                    input.type = "checkbox";
                    input.checked = !!value;
                    input.onchange = (e) => updateSetting(setting.id, e.target.checked);

                    const row = document.createElement("div");
                    row.className = "row";
                    row.appendChild(input);
                    row.appendChild(document.createTextNode(setting.label));

                    const desc = document.createElement("div");
                    desc.className = "setting-description";
                    desc.textContent = setting.description || "";

                    const wrapper = document.createElement("div");
                    wrapper.className = "setting-item";
                    wrapper.appendChild(row);
                    wrapper.appendChild(desc);
                    return wrapper;
                } else if (setting.type === "toggle") {
                    input = document.createElement("div");
                    input.className = "toggle-group";

                    setting.options.forEach((opt) => {
                        const btn = document.createElement("button");
                        btn.className = `toggle-btn ${opt.value === value ? "active" : ""}`;
                        btn.textContent = opt.label;
                        btn.onclick = () => updateSetting(setting.id, opt.value);
                        input.appendChild(btn);
                    });
                } else if (setting.type === "button") {
                    input = document.createElement("button");
                    input.className = setting.dangerous ? "danger btn" : "btn";
                    input.textContent = setting.label;
                    input.onclick = () => handleAction(setting.action);
                }

                if (input) {
                    header.appendChild(input);
                }

                container.appendChild(header);
                if (setting.description) {
                    const desc = document.createElement("div");
                    desc.className = "setting-description";
                    desc.textContent = setting.description;
                    container.appendChild(desc);
                }

                return container;
            }

            async function updateSetting(id, value) {
                state = await updateState(`userPrefs.${id}`, value);
                if (id === "theme") {
                    loadTheme(value);
                    document.getElementById("theme").checked = value === "dark";
                }
                renderSettingsList();
            }

            async function handleAction(action) {
                if (action === "reset") {
                    if (
                        confirm("Are you sure you want to reset all data? This cannot be undone.")
                    ) {
                        await saveFullState(initState());
                        location.reload();
                    }
                }
            }

            await initApp();
        </script>
    </body>
</html>
