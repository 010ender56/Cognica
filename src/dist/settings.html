        <style>body{min-height:100vh;position:relative}.settings-layout{grid-template-columns:240px 1fr;align-items:start;gap:32px;max-width:1000px;margin:0 auto;display:grid}.settings-sidebar{flex-direction:column;gap:4px;display:flex;position:sticky;top:80px}.category-btn{text-align:left;width:100%;color:var(--text-muted);cursor:pointer;background:0 0;border:none;border-radius:6px;padding:10px 14px;font-family:inherit;font-size:.9rem;transition:all .2s;display:block}.category-btn:hover{background-color:var(--surface-darker);color:var(--text)}.category-btn.active{background-color:var(--surface);color:var(--accent);font-weight:600}.settings-content{background:var(--card);border:1px solid var(--border-main);border-radius:12px;min-height:400px;padding:32px}.setting-item{border-bottom:1px solid var(--border-main);flex-direction:column;gap:8px;margin-bottom:24px;padding-bottom:24px;display:flex}.setting-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}.setting-header{justify-content:space-between;align-items:center;gap:16px;display:flex}.setting-label{font-size:.95rem;font-weight:600}.setting-description{color:var(--text-muted);margin-bottom:12px;font-size:.8rem}.dangerous-section{margin-top:32px;padding-top:16px}.dangerous-section h2{color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin-bottom:20px;font-size:1rem}.dangerous-item{border:1px solid var(--red-muted);border-radius:8px;flex-direction:column;gap:12px;padding:16px;display:flex}</style>
