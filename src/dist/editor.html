<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Quiz Creator</title>

        <!-- Your existing stylesheet -->
        <style>.quiz-wrapper{gap:30px;width:100%;height:100%;margin:0 auto;display:flex}.sidebar{border:1px solid var(--border-main);background:var(--card);border-radius:8px;flex-direction:column;gap:16px;padding:16px;display:flex;overflow-y:auto}.sidebar h2{margin-bottom:6px;font-size:1rem}.question-list{flex-direction:column;gap:10px;display:flex}.question-item{border:1px solid var(--border-main);background:var(--surface);cursor:pointer;border-radius:6px;height:50px;padding:10px;font-size:.85rem;transition:background .15s;position:relative}.question-item:hover{background:var(--surface-lighter)}.builder-panel{border:1px solid var(--border-main);background:var(--card);border-radius:8px;width:80vw;padding:20px;overflow-y:auto}.builder-panel h2{margin-bottom:12px;font-size:1.1rem}.builder-section{flex-direction:column;gap:12px;margin-bottom:20px;display:flex}.builder-section label{font-size:.85rem;font-weight:600}textarea{min-height:120px}.answer-options{flex-direction:column;gap:10px;display:flex}.answer-row{align-items:center;gap:10px;display:flex}.remove-question-button{border:none;border-top:1px solid var(--border-main);border-bottom:1px solid var(--border-main);width:100%;height:10px;position:absolute;bottom:-1px;left:50%;transform:translate(-50%)}.uploader-container{width:40%;max-width:40%}#image-input{display:none}.drop-zone{border:1px dashed var(--border-main);background-color:var(--surface-lighter);cursor:pointer;border-radius:6px;width:100%;height:120px;transition:all .3s;display:block}.drop-zone:hover,.drop-zone.drag-over{background-color:var(--surface);border-color:var(--border-darker)}.preview-box{background-position:50%;background-repeat:no-repeat;background-size:contain;border-radius:6px;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;display:flex;overflow:hidden}.upload-text{text-align:center;font-size:10px;font-weight:lighter}.answer-row .drop-zone{width:60px;height:40px}.answer-row .upload-text{font-size:8px}dialog{background-color:var(--card);border:1px solid var(--border-main);z-index:999;border-radius:20px;width:80vw;height:80vh;padding:30px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 4px 12px #0000001a}dialog::backdrop{-webkit-backdrop-filter:blur(5px);background-color:#0006}dialog h3{margin-bottom:20px;font-size:1.2rem}.row{flex-direction:column;display:flex}.dialog-container{max-width:50%}#edit-set-dialog h3{margin-top:0;margin-bottom:1.5rem;font-size:1.5rem;font-weight:600}.row{gap:.5rem;margin-bottom:1.25rem}.row label{font-size:.875rem;font-weight:500}</style>
      <script type="module" crossorigin src="/assets/editor-DEL0Pgjg.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/lib-DIhVFdeO.js">
      <link rel="stylesheet" crossorigin href="/assets/lib-Cvjez-a-.css">
    </head>

    <body>
        <!-- Top Bar will be generated programmatically -->

        <dialog id="edit-set-dialog">
            <div class="dialog-container">
                <h3>Edit Info</h3>
                <div class="uploader-container" id="quiz-info-uploader"></div>

                <div class="row">
                    <label for="quiz-title">Set Title:</label>
                    <input type="text" id="quiz-title" maxlength="55" />
                </div>

                <div class="row">
                    <label for="quiz-desc">Set Description:</label>
                    <textarea
                        id="quiz-desc"
                        placeholder="Enter set description here... (max 100 characters)"
                        maxlength="100"
                    ></textarea>
                    <p id="char-count">0/100</p>
                </div>

                <div class="row">
                    <label for="quiz-type">Type:</label>
                    <select id="quiz-type">
                        <option value="quiz">Quiz/Answer Questions</option>
                        <option value="flashcards">Flashcards/Study</option>
                    </select>
                </div>

                <div class="row" id="quiz-only-options">
                    <input type="checkbox" id="one-way-quiz" />
                    <label for="one-way-quiz">Allow going back:</label>
                </div>

                <button class="cta" id="save-quiz-info">Save</button>
                <button class="btn danger" id="delete-set">Delete</button>
            </div>
        </dialog>

        <div class="quiz-wrapper">
            <aside class="sidebar">
                <button class="btn" id="edit-set">Edit Info</button>
                <button class="btn" id="preview-set">Preview Set</button>
                <hr />

                <div class="question-list">
                    <!-- populate -->
                </div>

                <button class="cta" id="add-question-btn">+ Question</button>
            </aside>

            <section class="builder-panel">
                <div class="builder-section">
                    <label for="questionText">Question Text</label>
                    <div class="row" style="flex-direction: row; align-items: start;">
                        <div class="uploader-container" id="question-uploader"></div>
                        <textarea
                            id="questionText"
                            placeholder="Enter your question here..."
                            style="flex: 1;"
                        ></textarea>
                    </div>
                </div>
                <div class="builder-section">
                    <label for="type">Answer Type</label>
                    <select name="answer-type" id="type">
                        <option value="multiple-choice">Multiple Choice</option>
                        <option value="multiple-response">Multiple Response</option>
                        <option value="true-false">True or False</option>
                        <option value="short-answer">Short Answer</option>
                        <option value="long-answer">Long Answer</option>
                        <option value="match" disabled>Matching</option>
                        <option value="fill-blanks" disabled>Fill in the Blanks</option>
                    </select>
                </div>

                <div class="builder-section">
                    <label for="feedback">Feedback Mode</label>
                    <select id="feedback">
                        <option value="show_correct">Wrong/Right/Partially (Show Correct Answer)</option>
                        <option value="hide_correct">Wrong/Right/Partially (Hide Correct Answer)</option>
                        <option value="submitted">Submitted (No Feedback)</option>
                    </select>
                </div>

                <div class="builder-section">
                    <div class="row" style="flex-direction: row; gap: 20px;">
                        <label>
                            <input type="checkbox" id="required"> Required Question
                        </label>
                        <label>
                            <input type="checkbox" id="changeable"> Changeable after submission
                        </label>
                    </div>
                </div>

                <div class="builder-section">
                    <label>Answer Options</label>

                    <div class="answer-options">
                        <!-- populate -->
                    </div>

                    <button class="btn" id="add-option-btn">+ Add Option</button>
                </div>

                <button class="cta" id="save-question-btn">Save Question</button>
            </section>
        </div>
        <script src="/node_modules/localforage/dist/localforage.js"></script>
    </body>
</html>
