<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Quiz Homepage</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body {
                position: relative;
                min-height: 100vh;
            }

            .quiz-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
                margin-top: 20px;
                align-items: start;
            }

            .quiz-card {
                background: var(--card);
                border: 1px solid var(--border-main);
                border-radius: 10px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                transition: transform 0.15s ease;
                cursor: pointer;
            }

            .quiz-card:hover {
                transform: translateY(-3px);
            }

            .quiz-card:hover .quiz-desc {
                overflow: visible;
                display: block;
                white-space: normal;
            }

            .quiz-card img {
                width: 100%;
                height: 140px;
                object-fit: cover;
                border-radius: 6px;
            }

            .quiz-title {
                font-size: 1rem;
                font-weight: 600;
            }

            .quiz-type {
                font-size: 0.75rem;
                font-weight: 600;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .quiz-desc {
                font-size: 0.85rem;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }

            .create-btn {
                position: fixed;
                bottom: 24px;
                right: 24px;
                padding: 12px 20px;
                border-radius: 8px;
                background: var(--accent);
                color: var(--card);
                font-size: 0.9rem;
                font-weight: 600;
                cursor: pointer;
                border: none;
                transition:
                    box-shadow 0.1s linear,
                    transform 0.1s ease-in-out;
            }

            .create-btn:hover {
                transform: translateY(-3px);
                box-shadow: 3px 3px 0 var(--muted);
            }

            .create-btn:active {
                transform: none;
                box-shadow: none;
            }

            .menu-item {
                cursor: pointer;
                font-size: 0.85rem;
            }

            .create-options-container {
                position: fixed;
                bottom: 80px;
                right: 24px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                transition: opacity 0.2s ease, transform 0.2s ease;
            }

            .create-option-btn {
                text-align: center;
                cursor: pointer;
                background-color: var(--bg);
                transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            }

            .create-option-btn:hover {
                background-color: var(--bg);
                transform: translateY(-2px);
                box-shadow: 0 5px 5px var(--border-main);
            }

            .create-option-btn:active {
                transform: translateY(0);
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }

            #devContainer {
                border: 2px dashed var(--border-main);
                border-radius: 8px;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                padding: 20px;
                display: none;
            }

        </style>
    </head>

    <body>
        <!-- Top Bar -->
        <nav class="top-bar">
            <div class="top-bar-content">
                <label class="theme-toggle">
                    <input type="checkbox" id="theme" />
                    <span class="theme-icon"></span>
                </label>
                <button class="btn icon-btn">Feedback</button>
                <a href="/index.html" class="btn icon-btn">Home</a>
                <small>indev</small>
            </div>
        </nav>

        <header>
            <h1 id="greeting-header">Good morning</h1>
            <p id="greeting-paragraph">Let's make today productive!</p>
        </header>

        <!-- Grid of quizzes -->
        <div class="quiz-grid" id="quizGrid">
            <p id="noQuizzesMsg" style="display: none">No quizzes found. Create a new one!</p>
        </div>

        <div id="devContainer">
            <h2>Dev Panel</h2>
            <p>If you aren't a dev, then <b>get out now.</b></p>

            <hr />

            <button class="btn" id="newDevQuiz">Make a Dev Quiz</button>
            <button class="btn danger" id="devReset">Reset <code>state</code></button>
            <button class="btn" id="closeDev">Un-sneeze</button>
        </div>

        <!-- Create Button -->
        <div class="create-options-container hidden">
            <button class="btn create-option-btn" id="newImport">Import</button>
            <button class="btn create-option-btn" id="newFlashcard">Flashcards</button>
            <button class="btn create-option-btn" id="newQuiz">Quiz</button>
        </div>
        <button class="create-btn">Create New...</button>
    </body>

        <script src="node_modules/localforage/dist/localforage.js"></script>
        <script src="lib.js"></script>
        <script>
            const grid = document.getElementById("quizGrid");
            const greetingHeader = document.getElementById("greeting-header");
            const noQuizzesMsg = document.getElementById("noQuizzesMsg");
            const createNewBtn = document.querySelector(".create-btn");
            const createOptionsContainer = document.querySelector(".create-options-container");
            const createFromImportBtn = document.getElementById("newImport");
            const createFlashcardsBtn = document.getElementById("newFlashcard");
            const createQuizBtn = document.getElementById("newQuiz");
            const createDevQuizBtn = document.getElementById("newDevQuiz");

            let state;
            let sneezes = 0;

            function initApp() {
                const hours = new Date().getHours();

                // update greeting header
                if (hours < 12) {
                    greetingHeader.textContent = "Good morning";
                } else if (hours < 18) {
                    greetingHeader.textContent = "Good afternoon";
                } else {
                    greetingHeader.textContent = "Good evening";
                }

                // and update the greeting paragraph with a random message
                switch(Math.random() * 4 | 0) {
                  case 0:
                    document.getElementById("greeting-paragraph").textContent = "Let's make today productive!";
                    break;
                  case 1:
                    document.getElementById("greeting-paragraph").textContent = "Time to learn something new!";
                    break;
                  case 2:
                    document.getElementById("greeting-paragraph").textContent = "Ready to test your knowledge?";
                    break;
                  case 3:
                    document.getElementById("greeting-paragraph").textContent = "Your upcoming test will be no challenge at all.";
                    break;
                }

                // now we can load the quizzes from localforage
                localforage.getItem("appState", function (err, value) {
                    if (err) {
                        initState();
                    }
                });

                localforage
                    .getItem("appState")
                    .then(function (state) {
                        if (state) {
                            loadTheme(state.userPrefs.theme);
                            
                            // now we begin loading
                            for (const [key, currentSet] of Object.entries(state.sets)) {
                                const card = document.createElement("div");
                                card.className = "quiz-card";

                                card.innerHTML = `
                              <img src="${currentSet.image || "assets/placeholder.png"}" alt="Picutre for ${currentSet.name}">
                              <span class="quiz-type">${currentSet.type}</span>
                              <span class="quiz-title">${currentSet.name}</span>
                              <p class="quiz-desc">${currentSet.description}</p>
                            `;

                                card.addEventListener("click", () => {
                                    window.location.href = `/editor.html?set=${key}`;
                                });

                                grid.appendChild(card);
                            }
                        }
                    })
                    .catch(function (err) {
                        console.error("Error loading state:", err);
                    });

                // event listeners for create buttons
                createNewBtn.addEventListener("click", () => {
                    createOptionsContainer.classList.toggle("hidden");
                });

                createFromImportBtn.addEventListener("click", () => {
                    alert("feature not implemented yet")
                    alert("You must wait until 2099999 to use this feature!");
                });

                createFlashcardsBtn.addEventListener("click", () => {
                    window.location.href = "/editor.html?type=flashcards";
                });

                createQuizBtn.addEventListener("click", () => {
                    window.location.href = "/editor.html?type=quiz";
                });

                createDevQuizBtn.addEventListener("click", () => {
                    window.location.href = "/editor.html?type=devquiz";
                });

                document.getElementById("devReset").addEventListener("click", () => {
                  initState();

                  window.location.reload();
                });

                document.body.addEventListener("keydown", (e) => {
                  if(e.key === "NumLock" && e.altKey) {
                    e.preventDefault();
                    sneezes += 1;
                    console.log("achoo", sneezes)

                    if(sneezes >= 5) {
                      sneezes = 0;
                      document.getElementById("devContainer").style.display = "block";
                    }
                  }
                });

                document.getElementById("closeDev").addEventListener("click", () => {
                  document.getElementById("devContainer").style.display = "none";
                  sneezes = 0;
                });
            }

            initApp();
        </script>
    </body>
</html>
