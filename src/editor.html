<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Quiz Creator</title>
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/editor.css" />
    </head>

    <body>
        <!-- Top Bar will be generated programmatically -->

        <dialog id="edit-set-dialog">
            <div class="dialog-container">
                <h3>Edit Info</h3>
                <div class="uploader-container" id="quiz-info-uploader"></div>

                <div class="row">
                    <label for="quiz-title">Set Title:</label>
                    <input type="text" id="quiz-title" maxlength="55" />
                </div>

                <div class="row">
                    <label for="quiz-desc">Set Description:</label>
                    <textarea
                        id="quiz-desc"
                        placeholder="Enter set description here... (max 100 characters)"
                        maxlength="100"
                    ></textarea>
                    <p id="char-count">0/100</p>
                </div>

                <div class="row">
                    <label for="quiz-type">Type:</label>
                    <select id="quiz-type">
                        <option value="quiz">Quiz/Answer Questions</option>
                        <option value="flashcards">Flashcards/Study</option>
                    </select>
                </div>

                <div class="row" id="quiz-only-options">
                    <input type="checkbox" id="one-way-quiz" />
                    <label for="one-way-quiz">Allow going back:</label>
                </div>

                <button class="cta" id="save-quiz-info">Save</button>
                <button class="btn danger" id="delete-set">Delete</button>
            </div>
        </dialog>

        <div class="quiz-wrapper">
            <aside class="sidebar">
                <button class="btn" id="edit-set">Edit Info</button>
                <button class="btn" id="preview-set">Preview Set</button>
                <hr />

                <div class="question-list">
                    <!-- populate -->
                </div>

                <button class="cta" id="add-question-btn">+ Question</button>
            </aside>

            <section class="builder-panel">
                <div class="builder-section">
                    <label for="questionText">Question Text</label>
                    <div class="row" style="flex-direction: row; align-items: start;">
                        <div class="uploader-container" id="question-uploader"></div>
                        <textarea
                            id="questionText"
                            placeholder="Enter your question here..."
                            style="flex: 1;"
                        ></textarea>
                    </div>
                </div>
                <div class="builder-section">
                    <label for="type">Answer Type</label>
                    <select name="answer-type" id="type">
                        <option value="multiple-choice">Multiple Choice</option>
                        <option value="multiple-response">Multiple Response</option>
                        <option value="true-false">True or False</option>
                        <option value="short-answer">Short Answer</option>
                        <option value="long-answer">Long Answer</option>
                        <option value="match" disabled>Matching</option>
                        <option value="fill-blanks" disabled>Fill in the Blanks</option>
                    </select>
                </div>

                <div class="builder-section">
                    <label for="feedback">Feedback Mode</label>
                    <select id="feedback">
                        <option value="show_correct">Wrong/Right/Partially (Show Correct Answer)</option>
                        <option value="hide_correct">Wrong/Right/Partially (Hide Correct Answer)</option>
                        <option value="submitted">Submitted (No Feedback)</option>
                    </select>
                </div>

                <div class="builder-section">
                    <div class="row" style="flex-direction: row; gap: 20px;">
                        <label>
                            <input type="checkbox" id="required"> Required Question
                        </label>
                        <label>
                            <input type="checkbox" id="changeable"> Changeable after submission
                        </label>
                    </div>
                </div>

                <div class="builder-section">
                    <label>Answer Options</label>

                    <div class="answer-options">
                        <!-- populate -->
                    </div>

                    <button class="btn" id="add-option-btn">+ Add Option</button>
                </div>

                <button class="cta" id="save-question-btn">Save Question</button>
            </section>
        </div>

        <script src="/js/editor.js" type="module"></script>
    </body>
</html>
